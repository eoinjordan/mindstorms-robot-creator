name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK (requires android/MindstormsAICreator in repo)'
        type: boolean
        default: true

permissions:
  contents: write   # needed to upload to GitHub Releases

jobs:
  # ── 1. Run tests ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test

  # ── 2. UI Screenshots ─────────────────────────────────────────────────────────
  # Serves the web-app locally, opens every tab in headless Chromium via
  # Playwright, and saves PNG screenshots for the README and release artifacts.
  screenshot:
    name: Screenshot UI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Take UI screenshots
        run: npm run screenshot:ci

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screencaps/ci/*.png
          if-no-files-found: warn

      - name: Attach screenshots to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: screencaps/ci/*.png

  # ── 3. Windows desktop app (Electron) ─────────────────────────────────────────
  build-windows:
    name: Build Windows (exe + portable)
    needs: [test, screenshot]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        run: npm run electron:build:win
        env:
          # Set GH_TOKEN so electron-builder can publish to GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
          if-no-files-found: warn

      # Also attach to the GitHub Release if this is a tag push
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.msi

  # ── 3. Android APK ────────────────────────────────────────────────────────────
  # PREREQUISITE: The Android project must be committed to android/MindstormsAICreator/
  # in this repo. Run scripts/sync-android-to-repo.ps1 locally then commit + push.
  build-android:
    name: Build Android APK
    needs: [test, screenshot]
    runs-on: ubuntu-latest
    # Skip if the Android project is not in the repo
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true)

    steps:
      - uses: actions/checkout@v4

      - name: Check Android project exists
        id: android-check
        run: |
          if [ -f "android/MindstormsAICreator/gradlew" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::android/MindstormsAICreator not found in repo — skipping APK build."
            echo "Run scripts/sync-android-to-repo.ps1 and commit the result."
          fi

      - uses: actions/setup-java@v4
        if: steps.android-check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.android-check.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        if: steps.android-check.outputs.present == 'true'
        working-directory: android/MindstormsAICreator
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        if: steps.android-check.outputs.present == 'true'
        working-directory: android/MindstormsAICreator
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        if: steps.android-check.outputs.present == 'true'
        working-directory: android/MindstormsAICreator
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        if: steps.android-check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/MindstormsAICreator/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: |
          steps.android-check.outputs.present == 'true' &&
          startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/MindstormsAICreator/app/build/outputs/apk/release/*.apk
