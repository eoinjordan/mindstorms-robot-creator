name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build repo-side Android APK from android/robot-inventor-app'
        type: boolean
        default: true

permissions:
  contents: write   # upload to GitHub Releases
  id-token: write   # npm provenance

jobs:
  # 1. Run tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test

  # 2. UI screenshots
  # Serves the web-app locally, opens every tab in headless Chromium via
  # Playwright, and saves PNG screenshots for the README and release artifacts.
  screenshot:
    name: Screenshot UI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Take UI screenshots
        run: npm run screenshot:ci

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screencaps/ci/*.png
          if-no-files-found: warn

      - name: Attach screenshots to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: screencaps/ci/*.png

  # 3. Windows desktop app
  build-windows:
    name: Build Windows (exe + portable)
    needs: [test, screenshot]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        run: npm run electron:build:win
        env:
          # Set GH_TOKEN so electron-builder can publish to GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
          if-no-files-found: warn

      # Also attach to the GitHub Release if this is a tag push
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/*.msi

  # 4. macOS desktop app
  build-mac:
    name: Build macOS (.dmg)
    needs: [test, screenshot]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (macOS)
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable auto code-signing (no cert secrets configured)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist-electron/*.dmg
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.dmg

  # 5. Linux desktop app
  build-linux:
    name: Build Linux (.AppImage + .deb)
    needs: [test, screenshot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Linux)
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb

  # 6. Android APK
  # Builds an unsigned release APK from android/robot-inventor-app.
  # The APK is attached to the GitHub Release and is also the artifact
  # submitted to F-Droid (which re-builds from source itself).
  build-android:
    name: Build Android APK
    needs: [test, screenshot]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        working-directory: android/robot-inventor-app
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: android/robot-inventor-app
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        working-directory: android/robot-inventor-app
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/robot-inventor-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/robot-inventor-app/app/build/outputs/apk/release/*.apk

  # 7. Publish to npm
  # Publishes the MCP server package to npmjs.org on every version tag.
  # Requires NPM_TOKEN secret set in repo Settings > Secrets.
  publish-npm:
    name: Publish to npm
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (no scripts to avoid Electron download)
        run: npm ci --ignore-scripts

      - name: Run tests before publish
        run: npm test

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 8. Submit/update F-Droid metadata ─────────────────────────────────────────
  # On every version tag, pushes an updated metadata YAML to the
  # eoinjordan/fdroiddata fork on GitLab and opens (or updates) a merge request
  # against fdroid/fdroiddata so F-Droid can rebuild from source.
  #
  # ONE-TIME SETUP:
  #   1. Fork https://gitlab.com/fdroid/fdroiddata to your eoinjordan account
  #   2. In that fork, copy fdroid/com.eoinedge.robotinventor.yml
  #      to metadata/com.eoinedge.robotinventor.yml and merge to main
  #   3. Create a GitLab Personal Access Token (scopes: api, write_repository)
  #   4. Add it as GitHub secret: FDROID_GITLAB_TOKEN
  submit-fdroid:
    name: Submit to F-Droid
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE=$(grep -oP '(?<=versionCode = )\d+' android/robot-inventor-app/app/build.gradle.kts)
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Clone fdroiddata fork
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "Mindstorms Robot Creator CI"
          git clone \
            "https://eoinjordan:${FDROID_GITLAB_TOKEN}@gitlab.com/eoinjordan/fdroiddata.git" \
            fdroiddata --depth=1

      - name: Update metadata and create branch
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cd fdroiddata
          BRANCH="update/com.eoinedge.robotinventor-${VERSION_NAME}"
          git checkout -b "$BRANCH"

          python3 - <<'PY'
          import os, re

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["VERSION_CODE"]
          tag          = os.environ["TAG"]
          path         = "metadata/com.eoinedge.robotinventor.yml"

          with open(path) as f:
              content = f.read()

          # Update CurrentVersion / CurrentVersionCode
          content = re.sub(r"CurrentVersion: '[^']*'",
                            f"CurrentVersion: '{version_name}'", content)
          content = re.sub(r"CurrentVersionCode: \d+",
                            f"CurrentVersionCode: {version_code}", content)

          # Insert new Builds entry before AutoUpdateMode
          new_build = (
              f"  - versionName: '{version_name}'\n"
              f"    versionCode: {version_code}\n"
              f"    commit: {tag}\n"
              f"    subdir: android/robot-inventor-app\n"
              f"    gradle:\n"
              f"      - yes\n\n"
          )
          content = content.replace("AutoUpdateMode:", new_build + "AutoUpdateMode:", 1)

          with open(path, "w") as f:
              f.write(content)

          print(f"Updated {path} to {version_name} (versionCode {version_code})")
          PY

          git add "metadata/com.eoinedge.robotinventor.yml"
          git commit -m "Update com.eoinedge.robotinventor to ${VERSION_NAME}"
          git push origin "$BRANCH"

      - name: Open or update merge request via GitLab API
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          BRANCH="update/com.eoinedge.robotinventor-${VERSION_NAME}"
          SOURCE_PROJECT="eoinjordan%2Ffdroiddata"
          TARGET_PROJECT="fdroid%2Ffdroiddata"

          # Check if MR already exists for this branch
          EXISTING=$(curl -sf \
            -H "PRIVATE-TOKEN: ${FDROID_GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${SOURCE_PROJECT}/merge_requests?source_branch=${BRANCH}&state=opened" \
            | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['iid'] if mrs else '')")

          if [ -n "$EXISTING" ]; then
            echo "MR !${EXISTING} already open — skipping creation"
          else
            curl -sf -X POST \
              -H "PRIVATE-TOKEN: ${FDROID_GITLAB_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://gitlab.com/api/v4/projects/${SOURCE_PROJECT}/merge_requests" \
              -d "{
                \"source_branch\": \"${BRANCH}\",
                \"target_project_id\": \"$(curl -sf https://gitlab.com/api/v4/projects/${TARGET_PROJECT} | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"id\"])')\",
                \"target_branch\": \"master\",
                \"title\": \"Update com.eoinedge.robotinventor to ${VERSION_NAME}\",
                \"description\": \"Automated update from GitHub Actions release workflow.\\n\\nApp: Mindstorms Robot Creator\\nVersion: ${VERSION_NAME}\\nSource: https://github.com/eoinjordan/mindstorms-robot-creator/releases/tag/v${VERSION_NAME}\",
                \"remove_source_branch\": true
              }" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Created MR !{d[\"iid\"]}: {d[\"web_url\"]}')"
          fi

