name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write  # needed to enable Pages via API on first run

# Only one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (idempotent — safe to re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create Pages site with GitHub Actions as source.
          # Returns 409 if already enabled — that's fine, ignore it.
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Pages enable response: $HTTP"
          if [ "$HTTP" != "201" ] && [ "$HTTP" != "409" ]; then
            echo "Unexpected response $HTTP — failing"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web-app folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
