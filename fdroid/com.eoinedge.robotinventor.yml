AutoName: Mindstorms Robot Creator

Summary: Build and control LEGO MINDSTORMS robots with AI assistance

Description: |-
  Mindstorms Robot Creator is an open-source companion app for LEGO MINDSTORMS
  Robot Inventor (51515) and related hubs.

  Connect to your robot hub via Bluetooth Low Energy (BLE) or USB, then use the
  built-in AI code generator to write MicroPython programs. A live builder
  session panel lets you observe the robot's state, send REPL commands, and
  iterate quickly.

  Features:

  * BLE and USB connection to MINDSTORMS hubs
  * AI-powered code generator (MicroPython)
  * Builder session with live hub status
  * Voice keyword spotting for hands-free control
  * Works alongside the browser PWA and desktop app
  * Zero tracking, no accounts, no cloud required

  The app is part of the Mindstorms Robot Creator project which also includes an
  MCP server for integration with AI assistants (Claude, Copilot, Cursor) and a
  desktop Electron app.

  All source code is MIT-licensed and available on GitHub.

